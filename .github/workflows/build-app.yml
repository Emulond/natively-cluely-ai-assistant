name: Build App (Windows, unsigned)

# Produces an installable, UNSIGNED Windows build of Natively on a GitHub-hosted
# runner and uploads it as a workflow artifact. Unlike release-macos.yml, this
# needs no secrets at all — no code-signing certificate — so it works in a fork.
#
# Windows does not refuse to run unsigned installers; SmartScreen shows a
# "Windows protected your PC" prompt on first launch, cleared via
# More info > Run anyway. The NSIS installer uses the same appId as the
# official build, so it upgrades an existing install in place.
#
# Run it from the Actions tab > Build App (Windows, unsigned) > Run workflow,
# then download the artifact from the finished run's summary page.

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # No `submodules: recursive` here (unlike release-macos.yml): the premium
      # submodule is a private repo a fork cannot read, and the natively-api
      # gitlink has no .gitmodules entry at all, so recursing would fail. The
      # build is designed to degrade cleanly without both.
      - name: Checkout
        uses: actions/checkout@v4

      # Every compile step below is told to use this many jobs. A hosted runner
      # is 4 vCPU today, but reading it beats hardcoding a number that silently
      # under-uses a larger runner later.
      - name: Detect core count
        id: cores
        shell: pwsh
        run: |
          $n = [Environment]::ProcessorCount
          Write-Host "Runner has $n logical processors"
          "count=$n" >> $env:GITHUB_OUTPUT

      # WHY THIS JOB RUNS ON WINDOWS AT ALL, since the question comes up:
      # native-module/Cargo.toml has a Windows-only dependency block (wasapi +
      # the windows crate with Win32_Media_Audio / Win32_System_Com) for
      # system-audio capture, and postinstall rebuilds native Node addons
      # against Electron's ABI for the machine it runs on. Both need a Windows
      # toolchain. Linux runners are faster in general, but they cannot compile
      # this code — so the job is stuck here, and the way to make it quicker is
      # to make Windows itself less slow.
      #
      # Defender's real-time scanner inspects every one of the ~100k small files
      # npm writes and every artifact the Rust and packaging steps produce, and
      # it is the single biggest avoidable cost on a Windows runner. It is on
      # because GitHub's Windows images ship stock Windows, not because anything
      # here needs it: this is a throwaway VM compiling our own public source,
      # and the Linux and macOS runners in this same repo scan nothing at all.
      #
      # So it goes off entirely — every scanning mode, not just exclusions. The
      # exclusions are kept as well, because Tamper Protection can veto the
      # global switches on some images while still honouring exclusions; that
      # way the slow path is "some scanning" rather than "all scanning".
      #
      # continue-on-error, and each call is individually tolerant: a runner image
      # that refuses one of these should build slower, never fail. The
      # verification block at the end prints what actually took effect, so the
      # log says which it was instead of leaving us to guess.
      - name: Disable Windows Defender and other scanners
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          # Global off switches — the ones that matter.
          $prefs = @{
            DisableRealtimeMonitoring     = $true   # the file-by-file scanner
            DisableBehaviorMonitoring     = $true
            DisableIOAVProtection         = $true   # scans downloaded files (npm, cargo, models)
            DisableScriptScanning         = $true
            DisableArchiveScanning        = $true   # every .tgz npm unpacks
            DisableIntrusionPreventionSystem = $true
            DisableScanningNetworkFiles   = $true
            DisableRemovableDriveScanning = $true
            MAPSReporting                 = 'Disabled'
            SubmitSamplesConsent          = 'NeverSend'
          }
          # Splatting, because PowerShell cannot take a parameter NAME from a
          # variable — `Set-MpPreference -$k $value` is a syntax error, and each
          # setting is applied separately so one refusal does not lose the rest.
          foreach ($k in @($prefs.Keys)) {
            $splat = @{ $k = $prefs[$k] }
            try {
              Set-MpPreference @splat -ErrorAction Stop
              Write-Host "  off: $k"
            } catch {
              Write-Host "  BLOCKED: $k - $($_.Exception.Message)"
            }
          }

          # Exclusions as a fallback for images where Tamper Protection vetoes
          # the switches above.
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP,
                           "$env:LOCALAPPDATA\npm-cache", "$env:USERPROFILE\.cargo")) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch {}
          }
          foreach ($p in 'node.exe','npm.exe','rustc.exe','cargo.exe','link.exe','cl.exe','7z.exe','electron-builder.exe') {
            try { Add-MpPreference -ExclusionProcess $p -ErrorAction Stop } catch {}
          }

          # SmartScreen inspects executables as they are produced and launched.
          # The policy key does not exist on a stock image, so create it first
          # rather than assuming Set-ItemProperty can write into nothing.
          $ssKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
          try {
            if (-not (Test-Path $ssKey)) { New-Item -Path $ssKey -Force | Out-Null }
            New-ItemProperty -Path $ssKey -Name 'EnableSmartScreen' -Value 0 -PropertyType DWord -Force -ErrorAction Stop | Out-Null
            Write-Host "  off: SmartScreen"
          } catch { Write-Host "  BLOCKED: SmartScreen - $($_.Exception.Message)" }

          # Indexing and prefetch both walk files we are actively writing.
          foreach ($svc in 'WSearch','SysMain') {
            try { Stop-Service $svc -Force -ErrorAction Stop; Write-Host "  stopped: $svc" } catch {}
          }

          # Say what actually happened rather than assuming it worked.
          try {
            $s = Get-MpComputerStatus
            Write-Host "--- Defender status after changes ---"
            Write-Host "  RealTimeProtectionEnabled : $($s.RealTimeProtectionEnabled)"
            Write-Host "  IoavProtectionEnabled     : $($s.IoavProtectionEnabled)"
            Write-Host "  BehaviorMonitorEnabled    : $($s.BehaviorMonitorEnabled)"
            Write-Host "  IsTamperProtected         : $($s.IsTamperProtected)"
            if ($s.RealTimeProtectionEnabled) {
              Write-Host "::warning::Real-time scanning is STILL ON (Tamper Protection). Exclusions are doing the work instead."
            }
          } catch { Write-Host "Get-MpComputerStatus unavailable — Defender may not be present at all." }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The bundled ONNX models are fetched by postinstall and never change
      # unless download-models.js does. Re-downloading ~hundreds of MB on every
      # run is pure wall-clock cost for bytes that are identical each time.
      - name: Cache bundled ONNX models
        uses: actions/cache@v4
        with:
          path: resources/models
          key: onnx-models-${{ runner.os }}-${{ hashFiles('scripts/download-models.js') }}

      # Rust artifacts + the cargo registry. The audio module's dependency tree
      # is the bulk of its ~3 minute build; only native-module/src changes
      # actually need recompiling.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module
          shared-key: natively-win-x64

      # postinstall rebuilds the native node modules against Electron's ABI and
      # downloads the bundled ONNX models, so the packaged app works offline.
      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      # Rust audio capture module -> index.win32-x64-msvc.node
      #
      # CARGO_BUILD_JOBS matches the runner's core count so codegen fans out
      # across all of them, and incremental compilation is switched off: it
      # exists to speed up repeated local edits and only adds bookkeeping to a
      # cold CI build.
      - name: Build native audio module
        env:
          CARGO_BUILD_JOBS: ${{ steps.cores.outputs.count }}
          CARGO_INCREMENTAL: '0'
          CARGO_NET_RETRY: '3'
        run: npm run build:native

      - name: Verify required local models present
        run: node scripts/download-models.js --verify

      # Invoke electron-builder directly rather than `npm run dist`: that script
      # re-runs `npm run build`, whose rimraf can race the packager and ENOENT on
      # dist-electron. release-macos.yml documents the same workaround.
      #
      # WHERE THE TIME WENT. This step was 11m38s of an 18m30s run — 63% of the
      # build. Almost all of it is LZMA compressing an app that is mostly
      # already-compressed ONNX weights and an Electron runtime.
      # electron-builder.fast.cjs sets compression: 'store' and inherits
      # everything else from package.json `build`.
      #
      # The config lives in a FILE rather than a `-c.compression=store` flag
      # because PowerShell — the shell for `run:` steps on windows-latest — does
      # not pass that dot-notation through intact. electron-builder read `-c` as
      # --config and `.compression=store` as the filename:
      #   ⨯ ENOENT: no such file or directory, open '...\.compression=store'
      - name: Package Windows installer
        env:
          # electron-builder shells out to 7-Zip and app-builder; both honour
          # this for their worker pools.
          UV_THREADPOOL_SIZE: ${{ steps.cores.outputs.count }}
        run: ./node_modules/.bin/electron-builder --win --x64 --publish never --config electron-builder.fast.cjs

      # Only the NSIS installer. Globbing release/*.exe also picks up the
      # portable build, and since each carries its own Electron runtime plus the
      # bundled ONNX models that doubled the artifact to ~2.5 GB. Add
      # `release/*Portable*.exe` back here if you ever want the portable one.
      #
      # compression-level 0 because the installer is already compressed —
      # re-zipping it costs minutes of CPU and saves almost nothing.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: natively-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: release/*Setup*.exe
